version: "3.9"

services:
  frontend:
    build: ./frontend
    container_name: fiec_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - public_net
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: fiec_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - public_net
      - private_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: fiec_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - private_net # Isolado do Frontend e da Internet

  mongo:
    image: mongo:7.0
    container_name: fiec_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - private_net # Isolado do Frontend e da Internet

  redis:
    image: redis:7-alpine
    container_name: fiec_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - private_net # Isolado do Frontend e da Internet

  mailpit:
    image: axllent/mailpit:latest
    container_name: fiec_mailpit
    ports:
      - "8025:8025" # Interface Web para testar Verify Email e Esqueci a Senha
    networks:
      - private_net
      - public_net

  prometheus:
    image: prom/prometheus:latest
    container_name: fiec_prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - private_net

  grafana:
    image: grafana/grafana:latest
    container_name: fiec_grafana
    ports:
      - "3001:3000" # Painel NOC / SOC
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - public_net
      - private_net

networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge
    internal: true # Bloqueia tráfego externo direto aos bancos

volumes:
  pg_data:
  mongo_data:

